name: Reusable Node CI
on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '26'
      package-manager:
        description: 'Locked package manager to use (yarn or npm)'
        required: false
        type: string
        default: 'yarn'
      corepack-version:
        description: 'Pinned Corepack version used to launch the Yarn version declared in package.json'
        required: false
        type: string
        default: '0.35.0'
    secrets:
      NPM_TOKEN:
        required: false
        description: 'Token for private npm registry (if using @glpx scoped packages)'

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Yarn
      if: ${{ inputs.package-manager == 'yarn' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .yarn/cache
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Setup @glpx npm auth
      # Inlined (was a composite action in this repo): step-level `uses:`
      # references resolve against github.com on the runner, and this repo
      # only exists on gitea — the pre-clone failed every job.
      if: ${{ secrets.NPM_TOKEN != '' }}
      shell: bash
      run: |
        printf '//gitea.bk.glpx.pro/api/packages/glpx/npm/:_authToken=%s\n' \
          "${{ secrets.NPM_TOKEN }}" >> "$HOME/.npmrc"
        printf '@glpx:registry=https://gitea.bk.glpx.pro/api/packages/glpx/npm/\n' \
          >> "$HOME/.npmrc"

    - name: Install dependencies
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        COREPACK_VERSION: ${{ inputs.corepack-version }}
      run: |
        set -euo pipefail
        case "$PACKAGE_MANAGER" in
          npm)
            npm ci
            ;;
          yarn)
            grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"yarn@[0-9]' package.json || {
              echo 'package.json must pin Yarn in packageManager (for example, yarn@4.10.3).' >&2
              exit 1
            }
            npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn install --immutable
            ;;
          *)
            echo "Unsupported package manager: ${PACKAGE_MANAGER}" >&2
            exit 1
            ;;
        esac

    - name: Run linter
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        COREPACK_VERSION: ${{ inputs.corepack-version }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm) npm run lint ;;
          yarn) npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn lint ;;
          *) exit 1 ;;
        esac

    - name: Run type check
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        COREPACK_VERSION: ${{ inputs.corepack-version }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm) npm run typecheck ;;
          yarn) npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn typecheck ;;
          *) exit 1 ;;
        esac

    - name: Run tests
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        COREPACK_VERSION: ${{ inputs.corepack-version }}
      run: |
        case "$PACKAGE_MANAGER" in
          npm) npm test ;;
          yarn) npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn test ;;
          *) exit 1 ;;
        esac
