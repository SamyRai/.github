name: Reusable Docker Build & Push
on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of the image to build (without registry prefix)'
        required: true
        type: string
      platforms:
        description: 'Platforms to build for. Default amd64-only (matches the amd64 cluster); pass linux/amd64,linux/arm64 explicitly to opt into multi-arch.'
        required: false
        type: string
        default: 'linux/amd64'
      build-network:
        description: 'Docker build network mode'
        required: false
        type: string
        default: 'default'
      build-allow:
        description: 'Extra BuildKit entitlements'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Extra Docker build args. VERSION is always set to the immutable image tag.'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context (defaults to repo root).'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile, relative to the build context. Lets monorepos keep the Dockerfile under a subdir (e.g. smm-dashboard/Dockerfile).'
        required: false
        type: string
        default: 'Dockerfile'
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      GITEA_TOKEN:
        required: true
        description: 'Gitea repository token used for checkout and forwarded as BuildKit secret id=gitea_token for private Git dependencies.'
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
        description: 'Private @glpx Gitea npm token, forwarded as a BuildKit secret (id=glpx_npm_token) for Dockerfiles that run `deno install`/`npm install` at build time.'
      GO_MODULE_TOKEN:
        required: false
        description: 'Gitea read:package token, forwarded as a BuildKit secret (id=go_module_token) for Dockerfiles that run `go mod download` against the private Gitea Go registry. A BuildKit secret (not a build-arg) so the credential never lands in image history.'
      PUB_TOKEN:
        required: false
        description: 'Private Pub read token, forwarded as BuildKit secret id=pub_token for Dart/Flutter dependency resolution.'
    outputs:
      image-tag:
        description: 'Canonical immutable tag that was pushed: YYYYMMDDHHMMSS-<sha7>. Feed it into a GitOps values bump, or let Renovate pick it up.'
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      image-digest:
        description: 'Registry manifest digest produced by BuildKit (sha256:...).'
        value: ${{ jobs.build-and-push.outputs.image-digest }}
      image-reference:
        description: 'Exact immutable repository@sha256:... reference from the release receipt.'
        value: ${{ jobs.build-and-push.outputs.image-reference }}
      sbom-uri:
        description: 'OCI URI of the immutable image subject carrying the BuildKit SPDX SBOM attestation.'
        value: ${{ jobs.build-and-push.outputs.sbom-uri }}

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: generic
    outputs:
      image-tag: ${{ steps.meta.outputs.stamp }}
      image-digest: ${{ steps.push.outputs.digest }}
      image-reference: ${{ steps.push.outputs.reference }}
      sbom-uri: ${{ steps.push.outputs.sbom-uri }}
    steps:
      - name: Checkout code from Gitea
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITEA_TOKEN }}
          CHECKOUT_REPOSITORY: ${{ gitea.repository }}
          CHECKOUT_REF: ${{ gitea.ref }}
          CHECKOUT_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "http://gitea:3000/${CHECKOUT_REPOSITORY}.git"
          case "$CHECKOUT_REF" in
            refs/heads/*)
              git -c http.extraheader="Authorization: token ${CHECKOUT_TOKEN}" fetch --depth=1 origin "+${CHECKOUT_REF}:refs/remotes/origin/${CHECKOUT_REF#refs/heads/}"
              ;;
            refs/tags/*)
              git -c http.extraheader="Authorization: token ${CHECKOUT_TOKEN}" fetch --depth=1 origin "+${CHECKOUT_REF}:refs/tags/${CHECKOUT_REF#refs/tags/}"
              ;;
            *)
              git -c http.extraheader="Authorization: token ${CHECKOUT_TOKEN}" fetch --depth=1 origin "${CHECKOUT_SHA}"
              ;;
          esac
          git checkout --force "${CHECKOUT_SHA}"

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Login to Harbor
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "${REGISTRY_PASSWORD}" | docker login registry.bk.glpx.pro --username "${REGISTRY_USERNAME}" --password-stdin

      # Canonical platform-wide immutable tag: a sortable timestamp (so
      # "newest == highest", which Renovate's regex versioning relies on) plus the
      # short git sha for traceability. Keep this format in lockstep with the
      # Renovate versioning regex `^(\d{4})(\d{4})(\d{6})(?:-[0-9a-f]{7,40})?$`.
      # See docs/conventions/SHIP_PIPELINE.md in the cluster (helm) repo.
      - name: Compute immutable tag
        id: meta
        run: echo "stamp=$(date +%Y%m%d%H%M%S)-$(echo "${{ gitea.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          BUILD_DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_NETWORK: ${{ inputs.build-network }}
          BUILD_ALLOW: ${{ inputs.build-allow }}
          BUILD_ARGS: ${{ inputs.build-args }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ steps.meta.outputs.stamp }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GO_MODULE_TOKEN: ${{ secrets.GO_MODULE_TOKEN }}
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PLATFORMS: ${{ inputs.platforms }}
          SOURCE_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          builder="gitea-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-0}"
          metadata_file="${RUNNER_TEMP}/docker-build-metadata.json"
          repository="registry.bk.glpx.pro/${IMAGE_NAME}"
          docker buildx inspect "$builder" >/dev/null 2>&1 || docker buildx create --name "$builder" --use
          docker buildx use "$builder"

          build_args=(--build-arg "VERSION=${IMAGE_TAG}")
          while IFS= read -r arg; do
            [ -n "$arg" ] && build_args+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"

          allow_args=()
          while IFS= read -r entitlement; do
            [ -n "$entitlement" ] && allow_args+=(--allow "$entitlement")
          done <<< "$BUILD_ALLOW"

          secret_args=()
          # Quoted deliberately: the comma is required `--secret id=X,env=Y`
          # BuildKit syntax — one argument, not two array elements. Unquoted, the
          # linter reads it as SC2054 ("use spaces, not commas") and fails the
          # actionlint gate. Quoting is a no-op at runtime (no whitespace or
          # globs) and states the intent.
          # (Careful: a comment line beginning with the linter's own name is
          # parsed as a directive and errors with SC1072.)
          if [ -n "${NPM_TOKEN}" ]; then
            secret_args+=(--secret "id=glpx_npm_token,env=NPM_TOKEN")
          fi
          if [ -n "${GO_MODULE_TOKEN}" ]; then
            secret_args+=(--secret "id=go_module_token,env=GO_MODULE_TOKEN")
          fi
          if [ -n "${PUB_TOKEN}" ]; then
            secret_args+=(--secret "id=pub_token,env=PUB_TOKEN")
          fi
          secret_args+=(--secret "id=gitea_token,env=GITEA_TOKEN")

          # We push exactly ONE tag: `:<stamp>` (YYYYMMDDHHMMSS-<sha7>), the
          # immutable tag GitOps charts reference and Renovate auto-bumps. The
          # short git sha is embedded in it, and the build output manifest digest
          # gives exact `@sha256:` pinning, so a separate full-`:<sha>` tag was
          # redundant — and it triggered the SAME `412 Precondition Failed` that
          # `:latest` did: pushing a second tag pointing at the just-pushed
          # manifest trips Harbor's tag-immutability rule and fails the whole
          # build (see run 14581, 2026-07-05). We deliberately push neither
          # `:latest` nor `:<sha>`. Cross-build caching uses the dedicated
          # `:buildcache` tag. Legacy charts on `:latest` or a full `:<sha>` tag
          # must migrate to the `:<stamp>` tag (see SHIP_PIPELINE.md).
          docker buildx build \
            --push \
            --sbom=true \
            --platform "$PLATFORMS" \
            --network "$BUILD_NETWORK" \
            "${allow_args[@]}" \
            "${build_args[@]}" \
            "${secret_args[@]}" \
            --file "${BUILD_CONTEXT}/${BUILD_DOCKERFILE}" \
            --tag "registry.bk.glpx.pro/${IMAGE_NAME}:${IMAGE_TAG}" \
            --cache-from "type=registry,ref=registry.bk.glpx.pro/${IMAGE_NAME}:buildcache" \
            --cache-to "type=registry,ref=registry.bk.glpx.pro/${IMAGE_NAME}:buildcache,mode=max" \
            --metadata-file "$metadata_file" \
            "$BUILD_CONTEXT"

          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "BuildKit did not return a valid containerimage.digest." >&2
            exit 1
          fi
          reference="${repository}@${digest}"
          sbom_uri="oci://${reference}"
          {
            echo "digest=${digest}"
            echo "reference=${reference}"
            echo "sbom-uri=${sbom_uri}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Container release receipt"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${repository}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Exact reference | \`${reference}\` |"
            echo "| SBOM subject | \`${sbom_uri}\` |"
            echo "| Source commit | \`${SOURCE_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
