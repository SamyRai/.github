name: Actionlint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # reviewdog/action-actionlint is a Docker action. On this Gitea act_runner,
      # Docker actions run with `--network container:<job>` while the runner injects
      # `--add-host=host.docker.internal:host-gateway` (baikonur/gitea values
      # `container.options`), which Docker rejects: "conflicting options: custom
      # host-to-IP mapping and the network mode". Run actionlint as a binary inside
      # the job container to sidestep that. Note: actionlint defaults to scanning
      # .github/workflows, so point it at .gitea/workflows explicitly.
      - name: Run actionlint
        # ACTIONLINT_VERSION is pinned deliberately. The download script is
        # fetched from actionlint's main branch and installs the LATEST release
        # by default, so a new upstream release can turn this job red with no
        # change in this repo — which is exactly what happened: v1.7.12 began
        # rejecting the self-hosted `generic` label and the job failed on every
        # run from 2026-06 onward. The label is now declared in
        # .github/actionlint.yaml; the pin makes the next such change a
        # deliberate edit rather than a surprise.
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/dl-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash /tmp/dl-actionlint.bash "$ACTIONLINT_VERSION"
          # actionlint only models GitHub Actions; the -ignore rules below suppress
          # Gitea-specific false positives (no real bugs as of 2026-06-23):
          #  - 'gitea' context: the Gitea-recommended form; github.* is just an alias.
          #  - secrets-in-if: Gitea does not enforce GitHub's context-availability rules.
          #  - SC2015: intentional `A && B || C` install fallbacks.
          #  - SC2193: false positive — actionlint replaces matrix expressions with a
          #    fixed placeholder, so shellcheck wrongly sees a constant comparison.
          #  - permission scope "releases": a real Gitea scope with no GitHub
          #    equivalent, used by release.yml. actionlint only knows GitHub's set.
          # Self-hosted runner labels (`generic`) are declared in
          # .github/actionlint.yaml rather than ignored, so a genuinely misspelled
          # label is still caught.
          find .gitea/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 ./actionlint -color \
                -config-file .github/actionlint.yaml \
                -ignore 'undefined variable "gitea"' \
                -ignore 'context "secrets" is not allowed here' \
                -ignore 'unknown permission scope "releases"' \
                -ignore 'SC2015' \
                -ignore 'SC2193'

      # actionlint validates each file in isolation, so it cannot see that a
      # reusable workflow gained a secret its consumer templates never surfaced.
      # That is how MODULE_READ_TOKEN ended up declared by go-ci.yml but absent
      # from all three Go templates: nothing failed here, and the secret is
      # optional, so the breakage only appeared in a downstream repo's CI.
      - name: Verify CI templates account for every declared secret
        run: python3 scripts/verify-ci-template-secrets.py
