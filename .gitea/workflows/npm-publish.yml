name: Reusable NPM Publish
on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '26'
      registry-url:
        description: 'NPM Registry URL. The fleet Gitea instance is gitea.bk.glpx.pro; the bare gitea.glpx.pro has never had a DNS record.'
        required: false
        type: string
        default: 'https://gitea.bk.glpx.pro/api/packages/glpx/npm/'
      scope:
        description: 'NPM Package Scope (e.g. @glpx)'
        required: false
        type: string
        default: '@glpx'
      package-manager:
        description: 'Package manager to use (npm, yarn, bun)'
        required: false
        type: string
        default: 'npm'
      corepack-version:
        description: 'Pinned Corepack version used to launch the Yarn version declared in package.json'
        required: false
        type: string
        default: '0.35.0'
      bun-version:
        description: 'Pinned Bun version used for install, build, and publish'
        required: false
        type: string
        default: '1.3.14'
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (yarn)
        if: ${{ inputs.package-manager == 'yarn' }}
        env:
          COREPACK_VERSION: ${{ inputs.corepack-version }}
        run: |
          set -euo pipefail
          grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"yarn@[0-9]' package.json || {
            echo 'package.json must pin Yarn in packageManager (for example, yarn@4.10.3).' >&2
            exit 1
          }
          npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn install --immutable

      - name: Install dependencies (bun)
        if: ${{ inputs.package-manager == 'bun' }}
        env:
          BUN_VERSION: ${{ inputs.bun-version }}
        run: npm exec --yes "bun@${BUN_VERSION}" -- install --frozen-lockfile

      - name: Reject unsupported package managers
        if: ${{ inputs.package-manager != 'npm' && inputs.package-manager != 'yarn' && inputs.package-manager != 'bun' }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          echo "Unsupported package manager: ${PACKAGE_MANAGER}" >&2
          exit 1

      - name: Run build (if script exists)
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          COREPACK_VERSION: ${{ inputs.corepack-version }}
          BUN_VERSION: ${{ inputs.bun-version }}
        run: |
          set -euo pipefail
          grep -q '"build":' package.json || exit 0
          case "$PACKAGE_MANAGER" in
            npm) npm run build ;;
            yarn) npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn run build ;;
            bun) npm exec --yes "bun@${BUN_VERSION}" -- run build ;;
            *) exit 1 ;;
          esac

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          COREPACK_VERSION: ${{ inputs.corepack-version }}
          BUN_VERSION: ${{ inputs.bun-version }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm) npm publish ;;
            yarn) npm exec --yes "corepack@${COREPACK_VERSION}" -- yarn npm publish ;;
            bun) npm exec --yes "bun@${BUN_VERSION}" -- publish ;;
            *) exit 1 ;;
          esac
