name: Reusable Go Integration CI
on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.26'
    secrets:
      MODULE_READ_TOKEN:
        description: >-
          Gitea token with read:repository scope, used to fetch private
          go.glpx.pro/* modules. Optional.
        required: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}-integration
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPRIVATE: 'go.glpx.pro/*'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}

    - name: Configure private Go module access
      # See go-ci.yml for why: discovery hands back ssh://, which a runner
      # cannot authenticate.
      env:
        MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
      run: |
        if [ -n "$MODULE_READ_TOKEN" ]; then
          git config --global \
            url."https://$MODULE_READ_TOKEN@gitea.bk.glpx.pro/".insteadOf \
            "ssh://git@gitea.bk.glpx.pro:2222/"
        else
          echo "::warning::MODULE_READ_TOKEN unset; private go.glpx.pro modules cannot be fetched"
        fi

    - name: Run Integration Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: testuser
        DB_PASS: testpassword
        DB_NAME: testdb
      run: go test -v -tags=integration ./...
