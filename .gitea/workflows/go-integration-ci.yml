name: Reusable Go Integration CI
on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.26'
      staticcheck-version:
        description: 'Pinned Staticcheck version used by the shared quality gate'
        required: false
        type: string
        default: 'v0.7.0'
      govulncheck-version:
        description: 'Pinned govulncheck version used by the shared security gate'
        required: false
        type: string
        default: 'v1.6.0'
      gosec-version:
        description: 'Pinned gosec version used by the shared security gate'
        required: false
        type: string
        default: 'v2.28.0'
    secrets:
      MODULE_READ_TOKEN:
        description: >-
          Gitea token with read:repository scope, used to fetch private
          go.glpx.pro/* modules. Optional.
        required: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}-integration
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOPRIVATE: 'go.glpx.pro/*'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version: ${{ inputs.go-version }}

    - name: Configure private Go module access
      # See go-ci.yml for why: discovery hands back ssh://, which a runner
      # cannot authenticate.
      env:
        MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
      run: |
        if [ -n "$MODULE_READ_TOKEN" ]; then
          git config --global \
            url."https://$MODULE_READ_TOKEN@gitea.bk.glpx.pro/".insteadOf \
            "ssh://git@gitea.bk.glpx.pro:2222/"
        else
          echo "::warning::MODULE_READ_TOKEN unset; private go.glpx.pro modules cannot be fetched"
        fi

    - name: Download and verify dependencies
      run: |
        go mod download
        go mod verify

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi

    - name: Build packages
      run: go build ./...

    - name: Run Integration Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: testuser
        DB_PASS: testpassword
        DB_NAME: testdb
      run: |
        if [ "$(go env GOARCH)" = "amd64" ]; then
          go test -v -race -tags=integration ./...
        else
          echo "::warning::$(go env GOARCH) runner: running integration tests without -race"
          go test -v -tags=integration ./...
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run Staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@${{ inputs.staticcheck-version }} ./...

    - name: Scan reachable vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }} ./...

    - name: Run gosec
      run: go run github.com/securego/gosec/v2/cmd/gosec@${{ inputs.gosec-version }} -quiet ./...

    - name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)
