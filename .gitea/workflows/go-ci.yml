name: Reusable Go CI
on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Explicit Go version, overriding the caller's go.mod. Leave empty
          (the default) to take the toolchain from go.mod, which is what
          almost every repo wants. Set it only to force a floor that go.mod
          does not yet declare — note GOTOOLCHAIN=local below means a
          `toolchain` directive in go.mod cannot raise the version on its own,
          so a stale `go` directive otherwise silently builds and
          vulnerability-scans against an old stdlib.
        required: false
        type: string
        default: ''
      run-module-family:
        description: 'Also run a module-family job (setup-go + auth + tools + `make verify` across every nested module). For multi-module kits; replaces the per-repo duplicate module-family job.'
        required: false
        type: boolean
        default: false
      working-directory:
        description: >-
          Directory holding go.mod, for repos whose module is not at the
          checkout root (e.g. a workspace repo with the service under
          ./my-service). Defaults to the root, so existing callers are
          unaffected. Only `run:` steps are relocated; the module cache key
          still globs **/go.sum repo-wide, which is correct either way.
        required: false
        type: string
        default: '.'
      staticcheck-version:
        description: 'Pinned Staticcheck version used by the shared quality gate'
        required: false
        type: string
        default: 'v0.7.0'
      govulncheck-version:
        description: 'Pinned govulncheck version used by the shared security gate'
        required: false
        type: string
        default: 'v1.6.0'
      gosec-version:
        description: 'Pinned gosec version used by the shared security gate'
        required: false
        type: string
        default: 'v2.28.0'
    secrets:
      MODULE_READ_TOKEN:
        description: >-
          Gitea token with read:repository scope, used to fetch private
          go.glpx.pro/* modules. Optional: repos with no private module
          dependencies can omit it.
        required: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  # Release gates validate the module exactly as external consumers resolve it;
  # a repository-local go.work must never hide missing version requirements.
  GOWORK: 'off'
  # Keep the private module namespace off proxy.golang.org and the public
  # checksum database. Without this, resolution fails with a confusing sum
  # mismatch rather than an obvious "private repository" error.
  GOPRIVATE: 'go.glpx.pro/*'

jobs:
  test:
    # Must be amd64: this job runs `go test -race`, and the Go race detector
    # amd64 is the default platform fleet-wide; the Harbor-backed generic runner
    # is the canonical label for reusable Gitea workflow_call jobs.
    # The GOARCH gate on `-race` below is kept as defence-in-depth (TSan needs a 48-bit VA,
    # which the RPi 39-bit kernel lacks) for the rare explicit `runs-on: arm64` Go job.
    runs-on: generic
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        # setup-go prefers go-version when it is non-empty and falls back to
        # go-version-file otherwise, so the default empty input preserves the
        # historical go.mod behaviour for every existing caller.
        go-version: ${{ inputs.go-version }}
        # `defaults.run.working-directory` only relocates `run:` steps, never a
        # `uses:` step, so this path must be joined explicitly. Without it a repo
        # whose module lives in a subdirectory fails here with "The specified go
        # version file at: go.mod does not exist" and cannot use this workflow at
        # all. Default '.' yields './go.mod', identical to the previous literal.
        go-version-file: ${{ inputs.working-directory }}/go.mod

    - name: Cache Go modules
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Configure private Go module access
      # go.glpx.pro discovery returns an ssh:// clone URL. That is right for
      # humans, whose keys are loaded, but a runner has none -- the fetch dies
      # with "fatal: Could not read from remote repository". Rewrite to
      # token-authenticated https for CI only, leaving the vanity metadata and
      # every developer's SSH workflow untouched.
      env:
        MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
      run: |
        if [ -n "$MODULE_READ_TOKEN" ]; then
          git config --global \
            url."https://$MODULE_READ_TOKEN@gitea.bk.glpx.pro/".insteadOf \
            "ssh://git@gitea.bk.glpx.pro:2222/"
        else
          echo "::warning::MODULE_READ_TOKEN unset; private go.glpx.pro modules cannot be fetched"
        fi

    - name: Download dependencies
      run: go mod download

    - name: Verify downloaded modules
      run: go mod verify

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi

    - name: Build packages
      run: go build ./...

    - name: Run tests
      # The race detector (ThreadSanitizer) aborts on the cluster's arm64 RPi
      # runners with "unsupported VMA range" (39-bit VA kernel, TSan wants 48).
      # `runs-on: amd64` targets amd64, but runner-label overlap can still land
      # a job on arm64, so gate -race on the actual arch: full race coverage on
      # amd64, plain tests (no false failure) anywhere else.
      run: |
        if [ "$(go env GOARCH)" = "amd64" ]; then
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        else
          echo "::warning::$(go env GOARCH) runner: running tests without -race (ThreadSanitizer unsupported)"
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run Staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@${{ inputs.staticcheck-version }} ./...

    - name: Scan reachable vulnerabilities
      # A repo may carry scripts/vulncheck.sh to filter govulncheck through a
      # reviewed advisory allowlist — the common case is an upstream dependency
      # whose client package shares a module with its server (e.g. the Ollama
      # SDK), so every server-side advisory lands on the repo and none has a
      # fixed version. A permanently-red scanner is one nobody reads, so the
      # repo filters the reviewed entries and fails only on anything new. When
      # that script is present, defer to it so a deliberately-allowlisted
      # advisory does not keep CI red; otherwise run raw govulncheck so the gate
      # still binds for repos without an allowlist.
      run: |
        if [ -f scripts/vulncheck.sh ]; then
          bash ./scripts/vulncheck.sh
        else
          go run golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }} ./...
        fi

    - name: Run gosec
      # -exclude-generated skips files carrying the "Code generated ... DO NOT
      # EDIT." header. Without it, protoc-gen-go's standard zero-copy
      # descriptor embedding (unsafe.Slice/unsafe.StringData) trips G103 in
      # every *.pb.go, which is unfixable by design: hand-edits are lost on the
      # next regeneration, and regenerating with a newer protoc-gen-go
      # reproduces the identical pattern. Any repo with protobuf stubs was
      # otherwise permanently red no matter how clean its own code was.
      run: go run github.com/securego/gosec/v2/cmd/gosec@${{ inputs.gosec-version }} -quiet -exclude-generated ./...

    - name: Check go mod tidy
      # -diff is non-mutating and also reports a missing, newly required
      # go.sum; `git diff` alone cannot see untracked files.
      run: go mod tidy -diff

  module-family:
    if: ${{ inputs.run-module-family }}
    runs-on: generic
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOPRIVATE: go.glpx.pro/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
      - name: Configure private Go module access
        env:
          MODULE_READ_TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -n "$MODULE_READ_TOKEN" ]; then
            git config --global url."https://$MODULE_READ_TOKEN@gitea.bk.glpx.pro/".insteadOf "ssh://git@gitea.bk.glpx.pro:2222/"
          else
            echo "::warning::MODULE_READ_TOKEN unset; private go.glpx.pro modules cannot be fetched"
          fi
      - name: Install pinned quality tools
        # Versions come from the workflow inputs so this job cannot drift from
        # the `test` job's gate. govulncheck was previously @latest here, which
        # made the declared govulncheck-version input fiction and let a security
        # scanner change underneath callers without a commit.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ inputs.staticcheck-version }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheck-version }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ inputs.gosec-version }}
          go install github.com/vladopajic/go-test-coverage/v2@v2.19.0
      - name: Validate every module
        run: make verify
