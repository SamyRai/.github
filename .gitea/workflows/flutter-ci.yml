name: Reusable Flutter CI

# Quality gate for Flutter projects: locked resolution, format, strict analysis,
# tests, and an optional web build. Container publication remains owned by
# docker-ci.yml and must depend on this job in the caller, so a failing quality
# lane can never publish an image.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter SDK version to pin when flutter-version-file is empty.'
        required: false
        type: string
        default: ''
      flutter-version-file:
        description: 'Path to the repository-owned SDK version file. Set to an empty string only when flutter-version is explicitly pinned.'
        required: false
        type: string
        default: '.fvmrc'
      channel:
        description: 'Flutter channel.'
        required: false
        type: string
        default: 'stable'
      verify-command:
        description: 'Custom single verify command to run instead of the built-in format/analyze/test steps (e.g. "dart run tool/tasks.dart verify"). When empty, the built-in steps run.'
        required: false
        type: string
        default: ''
      custom-lint:
        description: 'Run `dart run custom_lint` after analyze (only used when verify-command is empty).'
        required: false
        type: boolean
        default: false
      format-check:
        description: 'Run `dart format --set-exit-if-changed` (only used when verify-command is empty).'
        required: false
        type: boolean
        default: true
      build-web:
        description: 'Run `flutter build web --release` on every event. The artifact is not published here; the gated ship job rebuilds it inside the image.'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Directory to run in (for monorepos).'
        required: false
        type: string
        default: '.'
      pub-registry-url:
        description: 'Private Pub hosted URL. Leave empty when the project uses only public or Git/path dependencies.'
        required: false
        type: string
        default: ''
    secrets:
      PUB_TOKEN:
        required: false
        description: 'Private Pub read token. Required when pub-registry-url is set.'

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version-file == '' && inputs.flutter-version || '' }}
          flutter-version-file: ${{ inputs.flutter-version-file }}
          cache: true

      - name: Authenticate to private Pub registry
        if: inputs.pub-registry-url != ''
        env:
          PUB_REGISTRY_URL: ${{ inputs.pub-registry-url }}
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUB_TOKEN"
          dart pub token add "$PUB_REGISTRY_URL" --env-var PUB_TOKEN

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify (custom command)
        if: inputs.verify-command != ''
        run: ${{ inputs.verify-command }}

      - name: Dart format (check)
        if: inputs.verify-command == '' && inputs.format-check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: inputs.verify-command == ''
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Custom lint
        if: inputs.verify-command == '' && inputs.custom-lint
        run: dart run custom_lint

      - name: Run tests
        if: inputs.verify-command == ''
        run: flutter test --no-pub --coverage

      - name: Build web
        if: inputs.build-web
        run: flutter build web --release --no-pub
