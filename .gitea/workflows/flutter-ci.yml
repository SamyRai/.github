name: Reusable Flutter CI

# Quality gate for Flutter projects: format check, analyze, optional custom_lint,
# tests, and an optional web build. Mirrors the other stack reusable workflows
# (deno-ci/go-ci/node-ci). It does NOT build or push a container image — that is
# the job of the reusable docker-ci.yml, called from a repo's own ship workflow
# on push to main (see docs/flutter-web deploy). Keeping quality here and the
# image build there matches the backend split (ci gates in PR workflows, image
# build in docker-build.yml).
on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter SDK version to pin (ignored when flutter-version-file is set).'
        required: false
        type: string
        default: '3.41.2'
      flutter-version-file:
        description: 'Path to a version file (e.g. .fvmrc) to read the SDK version from. Takes precedence over flutter-version when non-empty.'
        required: false
        type: string
        default: ''
      channel:
        description: 'Flutter channel.'
        required: false
        type: string
        default: 'stable'
      verify-command:
        description: 'Custom single verify command to run instead of the built-in format/analyze/test steps (e.g. "dart run tool/tasks.dart verify"). When empty, the built-in steps run.'
        required: false
        type: string
        default: ''
      custom-lint:
        description: 'Run `dart run custom_lint` after analyze (only used when verify-command is empty).'
        required: false
        type: boolean
        default: false
      format-check:
        description: 'Run `dart format --set-exit-if-changed` (only used when verify-command is empty).'
        required: false
        type: boolean
        default: true
      build-web:
        description: 'Run `flutter build web --release` on push events, to catch web-build breakage early. The artifact is not published here (the ship workflow rebuilds it inside the image).'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Directory to run in (for monorepos).'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version-file == '' && inputs.flutter-version || '' }}
          flutter-version-file: ${{ inputs.flutter-version-file }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify (custom command)
        if: inputs.verify-command != ''
        run: ${{ inputs.verify-command }}

      - name: Dart format (check)
        if: inputs.verify-command == '' && inputs.format-check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: inputs.verify-command == ''
        run: flutter analyze

      - name: Custom lint
        if: inputs.verify-command == '' && inputs.custom-lint
        run: dart run custom_lint

      - name: Run tests
        if: inputs.verify-command == ''
        run: flutter test --no-pub --coverage

      - name: Build web (catch breakage early)
        if: inputs.build-web && gitea.event_name == 'push'
        run: flutter build web --release
