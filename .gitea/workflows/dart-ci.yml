name: Reusable Dart/Flutter CI
#
# Mirrors node-ci.yml / go-ci.yml for the Flutter fleet. Runs the repo's own
# verifier (`dart run tool/tasks.dart verify` when present, else the standard
# `flutter pub get` + `dart analyze` + `flutter test` fallback) with optional
# private Gitea pub-registry auth for packages that depend on `glpx`-scoped
# Dart packages.
#
# Reusable: consumer repos call it via `uses:` (see templates/ci/flutter.yml).
on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter SDK version (channel tag or exact version)'
        required: false
        type: string
        default: '3.44.7'
      verify-command:
        description: 'Repo verifier command. Defaults to the dev-kit `tool/tasks.dart verify`; falls back to analyze+test if tool/tasks.dart is absent.'
        required: false
        type: string
        default: 'dart run tool/tasks.dart verify'
      cache:
        description: 'Cache the Flutter SDK'
        required: false
        type: boolean
        default: true
    secrets:
      PUB_TOKEN:
        required: false
        description: 'Token for the private Gitea pub registry (only if the repo depends on glpx-scoped Dart packages).'

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ inputs.flutter-version }}
          cache: ${{ inputs.cache }}

      - name: Authenticate private pub registry
        if: ${{ secrets.PUB_TOKEN != '' }}
        run: dart pub token add https://gitea.glpx.pro/api/packages/glpx/pub/ --secret '${{ secrets.PUB_TOKEN }}'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify (repo verifier)
        if: ${{ inputs.verify-command != '' && hashFiles('tool/tasks.dart') != '' }}
        run: ${{ inputs.verify-command }}

      - name: 'Verify (fallback: analyze + test)'
        if: ${{ inputs.verify-command == '' || hashFiles('tool/tasks.dart') == '' }}
        run: |
          dart analyze --fatal=infos
          flutter test
