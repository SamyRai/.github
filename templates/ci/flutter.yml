# Consumer CI — Flutter / Dart (reusable dart-ci.yml).
# Drop into <repo>/.gitea/workflows/ci.yml and remove this header comment.
#
# This calls the fleet-wide dart-ci.yml reusable workflow. For the dev-kit
# repos that ship `tool/tasks.dart`, that verifier (codegen stability, token
# freshness, format, analyze, dep-direction, token gates, API snapshots,
# per-member tests) runs in place of the generic analyze+test fallback.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dart-ci:
    uses: mukimovd/.github/.gitea/workflows/dart-ci.yml@main
    with:
      flutter-version: '3.44.7'   # pinned per AGENTS.md codegen matrix
      # verify-command defaults to `dart run tool/tasks.dart verify` (dev-kit).
      # Remove the input to use the analyze+test fallback for non-kit repos.
    secrets:
      # Only needed if the repo imports glpx-scoped Dart packages from the
      # private Gitea pub registry.
      PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
