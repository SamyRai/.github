name: strict-governance

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.head_ref || gitea.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install Dependencies (with error handling)
        run: |
          deno install --frozen || {
            echo "::warning::Deno install failed, retrying with fallback options..."
            deno install --allow-scripts --frozen || {
              echo "::error::Deno install failed. This may be due to Deno v2.x compatibility issues."
              echo "::error::Please check that your import maps and dependencies are compatible with Deno v2.x."
              echo "::error::See https://deno.com/manual/v2.0/migration_v1_v2 for migration guide."
              exit 1
            }
          }

      - name: Verify Strict DS + Contracts (with error handling)
        run: |
          deno task typecheck:ds || {
            echo "::warning::typecheck:ds failed, continuing with tests..."
            echo "::warning::This may indicate type incompatibilities with Deno v2.x."
          }
          deno task test:ds || {
            echo "::error::DS contract tests failed."
            echo "::error::This may indicate contract incompatibilities or runtime issues."
            exit 1
          }
